name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install pytest numpy soundfile ebooklib beautifulsoup4 opencc-python-reimplemented gradio

      - name: Run Pytest Suite
        run: |
          pytest -v tests/
