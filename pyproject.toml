[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-to-audiobook-qwen3"
version = "0.1.0"
description = "Production-grade EPUB to Audiobook pipeline powered by Qwen3-TTS on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "hariquasar", email = "hariquasar@gmail.com"}
]
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "qwen-tts>=0.1.1",
    "transformers>=4.40.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "opencc-python-reimplemented>=0.1.7",
    "gradio>=5.0.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
epub-audiobook = "cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
